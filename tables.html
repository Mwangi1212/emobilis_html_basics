<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
        }

        table {
            width: 60%;
            border: 1px solid black;
            margin: auto;
            border-collapse: collapse;
            /* This property is used to collapse the borders of the table cells into a single border. */
        }

        th {
            color: #800000;
            border: 1px solid #000000;
            padding: 12px 8px;
            text-align: left;
            background-color: #ffff00;
        }

        td {
            border: 1px solid #000000;
            padding: 12px 8px;
            text-align: left;
        }
        .salary {
            color: #008000;
            font-weight: bold;
        }

        /* CSS frameworks---Bootstrap */
    </style>

</head>

<body>
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>City</th>
                <th>Age</th>
                <th>Salary</th>
            </tr>

        </thead>
        <tbody>
            <tr>
                <td>John</td>
                <td>Smith</td>
                <td>Nairobi</td>
                <td>35</td>
                <td class="salary">$280</td>
            </tr>
            <tr>
                <td>Alexis</td>
                <td>Mwangi</td>
                <td>Juja</td>
                <td>22</td>
                <td class="salary">$1000</td>
            </tr>
            <tr>
                <td>Alex</td>
                <td>Mwaura</td>
                <td>Kikuyu</td>
                <td>20</td>
                <td class="salary">$100</td>
            </tr>
            <tr>
                <td>Caleb</td>
                <td>Mwai</td>
                <td>Kiambu</td>
                <td>27</td>
                <td class="salary">$250</td>
            </tr>
            <tr>
                <td>Lovette</td>
                <td>Wambui</td>
                <td>Limuru</td>
                <td>30</td>
                <td class="salary">$120</td>
            </tr>

        </tbody>
    </table>
    <!-- Unordered Lists -->
    <ul>
        <li>Nairobi</li>
        <li>Mombasa</li>
        <li>Lamu</li>
        <li>Kiambu</li>
        <li>Kisumu</li>

    </ul>

</body>

</html>
