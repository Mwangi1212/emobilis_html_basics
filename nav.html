<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Neuton:ital,wght@0,200;0,300;0,400;0,700;0,800;1,400&display=swap');


        * {
            padding: 0;
            margin: 0;
        }

        body {
            font-family: "Neuton", serif;
        }

        nav {
            display: flex;
            justify-content: center;
            /* background: #000; */
        }

        .nav-items {
            width: 60%;
            display: flex;
            justify-content: space-between;
            background:#808080;
            align-items: center;
        }

        .nav-items ul {
            display: flex;
            list-style: none;
        }

        .nav-items li {
            padding: 10px;
            margin-right: 16px;
            margin-left: 16px;
        }
        .nav-items a{
            text-decoration: none;
            color: #0000ff;
            text-transform: capitalize;
        }
        .nav-items a:hover{
            color: #8a2be2;
        }
    </style>
</head>

<body>
    <!-- Semantic tags -->
    <nav>
        <div class="nav-items">
            <img src="images/icons8-computer-48.png" alt="Logo">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
    </nav>
</body>

</html>
